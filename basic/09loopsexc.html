<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let i = -2;

        while(i <= 2){
            if(i < 0){
                console.log("Licznik mniejszy od 0");
            }else if(i === 0){
                console.log("Licznik === 0");
            }else{
                console.log("Licznik wiekszy od 0");
            }
            i++;
        }

        for(let x = -2;x <= 2;x++){
            if(x === 0) console.log("x === 0");
            if(x > 0){
                console.log("x > 0");
            }else if(x < 0){
                console.log("x < 0");
            }
        }
    </script>
</body>
</html>
