<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let i = 0;
         
        while(i < 5){
            console.log("Wartosc i: ",i);
            i = i + 1;
        }

        let a = 5;

        do{
            a = a - 1;
            console.log("Wartsc a: ",a);
        }while(a > 0);

        for(let b = 0; b < 5; b++){//inkrementacja dziala w js
            console.log("Wartosc b: ",b);
        }
    </script>
</body>
</html>
