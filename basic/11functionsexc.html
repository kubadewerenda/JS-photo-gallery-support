<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <script>
        function substract(a, b){
            return a - b;
        }

        console.log("Wynik odejmowania: ",substract(5, 2));

        function abs(a){
            if(a < 0) return -a;
            return a;
        }

        console.log("Wynik bezwzgledny: ",abs(-2));
    </script>
</body>
</html>
