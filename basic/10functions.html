<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function add(a, b){
            let c = a + b;
            console.log("Wynik: ",c);
        }

        add(8, 3);

        function multiply(a, b){
            return a * b;
        }

        let result = multiply(15, 4);
        console.log("Wynik: ",result)

        //wyrazenie funkcyjne
        let division = function (a, b) {
            return a / b;
        }

        let divisonResult = division(100, 3);
        console.log("Wynik dzielnia: ", divisonResult);

        let data = 0;//zmienna globalna, w całym programie
        function test(){
            let text = "Siemka";//zmienna lokalna, widoczna tylko w naszej funkcji
            console.log("Wartosc data: ", data);
            console.log("Wartosc text: ", text);
        }
        //console.log("Wartosc text: ", text); tutaj to nie zadziala bo text lokalne
        test();
    </script>
</body>
</html>
